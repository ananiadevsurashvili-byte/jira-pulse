# Publishes the dashboards to GitLab Pages on every push to main.
# Mirrors the GitHub Pages layout: index.html + app.js + styles.css at the
# site root, with admin/, logistics/ and csp/ as subfolders. The relay
# source is server-side code and stays out of the published site.
pages:
  stage: deploy
  image: alpine:3.20
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p public
    - cp index.html app.js styles.css public/
    - cp -r admin logistics csp public/
  artifacts:
    paths:
      - public
