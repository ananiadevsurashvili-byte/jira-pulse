<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JiraPulse · Redirecting…</title>
<meta name="robots" content="noindex" />
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0b0f1e; color:#e7eaf6; font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif; }
  .box { text-align:center; padding:40px 28px; }
  .logo { font-size:1.5rem; letter-spacing:.2px; }
  .logo b { color:#22d3ee; }
  .grad { background:linear-gradient(90deg,#6366f1,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; }
  p { color:#8b93ad; margin:10px 0 22px; font-size:.92rem; line-height:1.5; }
  a.btn { display:inline-block; padding:10px 22px; border-radius:10px; text-decoration:none; font-weight:600; font-size:.9rem;
          color:#fff; background:linear-gradient(90deg,#6366f1,#4f46e5); box-shadow:0 6px 18px rgba(99,102,241,.35); }
  .ka { font-size:.8rem; margin-top:14px; color:#5f688a; }
</style>
<script>
  /* GitHub Pages project site: every missing path serves this 404 page.
     Forward them to the real product URL, preserving query (?v=…) and
     hash (#…). Namespace-agnostic: works under the current
     ananiadevsurashvili-byte.github.io host AND under a future renamed
     host (e.g. jirapulse.github.io) — the repo segment is derived from
     the hostname's first label instead of being hard-coded. */
  (function () {
    var host = location.hostname;            /* e.g. jirapulse.github.io */
    var repo = '/' + host.split('.')[0];     /* → '/jirapulse'          */
    var p = location.pathname;
    var to;
    if (p === repo || p.indexOf(repo + '/') === 0) {
      /* already inside the project but at a missing path → app root */
      to = repo + '/';
    } else {
      /* missing repo segment → prepend it (covers /logistics/, /, /admin/…) */
      to = repo + p;
    }
    to += location.search + location.hash;
    window.location.replace(to);
  })();
</script>
</head>
<body>
  <div class="box">
    <div class="logo">Jira<b>Pulse</b> <span class="grad">· Logistics</span></div>
    <p>Taking you to the JiraPulse product…<br />If nothing happens, use the button below.</p>
    <a class="btn" href="/jira-pulse/logistics/">Open JiraPulse · Logistics</a>
    <p class="ka">გადამისამართება JiraPulse-ზე… თუ ვერ მოხდა, დააჭირეთ ღილაკს.</p>
  </div>
</body>
</html>
