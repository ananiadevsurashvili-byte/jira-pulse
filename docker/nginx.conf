server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 18 Nov 2026 review, Phase 4.2: browser-level containment for the whole
    # static app (served from jirapulse.caucasusauto.com / -test).
    #  - X-Frame-Options DENY          → no clickjacking / framing
    #  - frame-ancestors 'none'        → CSP equivalent of the above
    #  - script-src                    → self + the two CDNs the pages load:
    #      cdn.jsdelivr.net  (xlsx + chart libs, pinned versions, SRI-hashed)
    #      accounts.google.com (Google Identity Services — no stable hash
    #        exists for GSI, so SRI is impossible there; CSP pins the host)
    #  - 'unsafe-inline' in script-src: the pages carry small bootstrap
    #    <script> blocks (ADMIN_PANEL flag, i18n boot). Removing them needs a
    #    refactor to external bundles + nonces; tracked as follow-up.
    #  - connect-src                   → the relay (*.web.val.run), Jira REST
    #    (viewer's own connection path), and Google's token endpoints used by
    #    the GSI client.
    #  - frame-src                     → Google's sign-in popup/iframe host.
    #  - img-src  data: blob: https:   → Jira attachment binaries arrive as
    #    object URLs (blob:) and remote icons over https.
    #  - font-src                      → Google Fonts css + woff2.
    #  - object-src 'none', base-uri 'self' → hardening defaults.
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.atlassian.net https://*.web.val.run https://accounts.google.com; frame-src https://accounts.google.com https://accounts.youtube.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
